AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  phtracker serverless stack (FastAPI + Mangum on Lambda, HTTP API Gateway, DynamoDB single table, Cognito, and SSM-configured settings).

Parameters:
  AppName:
    Type: String
    Default: phtracker
  Env:
    Type: String
    Default: dev
  CorsAllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: Comma-separated allowed origins for CORS.
  CognitoCallbackURLs:
    Type: CommaDelimitedList
    Default: http://localhost:5173/callback
    Description: Allowed OAuth callback URLs for the SPA.
  CognitoLogoutURLs:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: Allowed logout URLs for the SPA.
  JwtIssuer:
    Type: String
    Default: ''
    Description: Optional override for JWT issuer (defaults to Cognito domain).
  JwtAudienceParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /phtracker/dev/jwt_audience
    Description: SSM path containing JWT audience/client ID (no secrets committed).

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        APP_NAME: !Sub '${AppName}-${Env}'
        TABLE_NAME: !Ref PhtrackerTable
        REGION: !Ref AWS::Region
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
        JWT_AUDIENCE: !Ref JwtAudienceParam
        JWT_ISSUER: !If
          - HasIssuer
          - !Ref JwtIssuer
          - !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        CORS_ALLOWED_ORIGINS: !Join [ ",", !Ref CorsAllowedOrigins ]

Conditions:
  HasIssuer: !Not [ !Equals [ !Ref JwtIssuer, '' ] ]

Resources:
  PhtrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub '${AppName}-${Env}'
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowedOrigins
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
      StageName: !Ref Env

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AppName}-${Env}-api'
      CodeUri: ../backend/
      Handler: main.handler
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhtrackerTable

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AppName}-${Env}'
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
      UsernameAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${AppName}-${Env}-spa'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs: !Ref CognitoCallbackURLs
      LogoutURLs: !Ref CognitoLogoutURLs
      SupportedIdentityProviders:
        - COGNITO

Outputs:
  TableName:
    Description: DynamoDB table for profiles, pH logs, foods, and model outputs.
    Value: !Ref PhtrackerTable
  HttpApiUrl:
    Description: Base URL for the HTTP API.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}'
  UserPoolId:
    Description: Cognito User Pool ID.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID for the SPA.
    Value: !Ref UserPoolClient
